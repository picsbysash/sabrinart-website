  <script>
    (function () {
      var splash = document.getElementById('sa-splash');
      var root = document.getElementById('root');
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        if ((root && root.childElementCount > 0) || tries > 60) {
          if (splash) splash.classList.add('hide');
          clearInterval(iv);
        }
      }, 200);
    })();
